# EMBEDDED SERVER CONFIGURATION
server.port=1984
management.server.port=8080
management.security.enabled=false
server.servlet.session.timeout=30m

jwt.secret=javainuse

# DATASOURCE
spring.datasource.continue-on-error=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://172.17.0.2:5432/eagleeye_db
# JDBC URL of the database.
spring.datasource.name=eagleeye_db
spring.datasource.username=postgres
# Login username of the database.
spring.datasource.password=postgres
spring.datasource.platform=eagleeye_db

# JPA
spring.jpa.generate-ddl=true
# Whether to initialize the schema on startup.
#spring.jpa.hibernate.ddl-auto=create
# DDL mode. This is actually a shortcut for the "hibernate.hbm2ddl.auto" property. Defaults to "create-drop" when using an embedded database and no schema manager was detected. Otherwise, defaults to "none".
spring.jpa.show-sql=true
#spring.jpa.database=spring_test
# Target database to operate on, auto-detected by default. Can be alternatively set using the "databasePlatform" property.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false